<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stone</title>
    <link rel="icon" href="data:," />
    <script>
      // Sets the theme class before first paint so a dark theme does not flash white.
      (function () {
        try {
          var saved = localStorage.getItem("stone-theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
