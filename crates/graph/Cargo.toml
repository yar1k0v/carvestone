[package]
name = "carvestone-graph"
description = "Carvestone code graph: tree-sitter facts and per-language resolvers, no SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protobuf.workspace = true
scip.workspace = true
serde_json.workspace = true
tree-sitter.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-dart.workspace = true

# Same as the workspace lints plus no stray prints: output belongs to the CLI.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
