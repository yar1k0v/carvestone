[package]
name = "carvestone-git"
description = "Carvestone git wrapper: shells out to the git CLI and parses its output, no SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

# Same as the workspace lints plus no stray prints: output belongs to the CLI.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
